---
- name: Install Java 17 runtime
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ jar_src }}"
    dest: "{{ app_dir }}/{{ app_name }}.jar"
    owner: "{{ app_user }}"
    mode: "0644"
  notify: Restart status-monitor

- name: Install systemd unit
  ansible.builtin.template:
    src: status-monitor.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0644"
  notify: Restart status-monitor

- name: Enable and start the service
  ansible.builtin.systemd:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Run pending handlers now
  ansible.builtin.meta: flush_handlers

- name: Wait for the app port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    timeout: 60

- name: Call /health
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    return_content: true
  register: health
  retries: 10
  delay: 3
  until: health.status == 200

- name: Show health response
  ansible.builtin.debug:
    var: health.json
