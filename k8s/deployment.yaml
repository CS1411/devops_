apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-monitor
  labels:
    app: status-monitor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: status-monitor
  template:
    metadata:
      labels:
        app: status-monitor
        tier: backend
    spec:
      containers:
        - name: status-monitor
          image: status-monitor:1.0
          imagePullPolicy: Never   # image is loaded into Minikube with "minikube image load"
          envFrom:
            - configMapRef:
                name: status-monitor-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
